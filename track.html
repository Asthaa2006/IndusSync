<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SetuSaathi — Track Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182339;--ink-soft:#4B5468;--paper:#F5F1E6;--paper-card:#FCFAF3;
    --rule:#DAD1BC;--brass:#9C7A3C;--brass-deep:#7C5E2A;--sage:#33604A;--rust:#8F3B2A;--radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.6;padding-bottom:60px;}
  h1,h2,h3{font-family:'Source Serif 4',serif;font-weight:500;color:var(--ink);}
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 6%;background:rgba(245,241,230,0.92);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand-mark{width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-size:.8rem;color:var(--ink);}
  .brand-name{font-family:'Source Serif 4',serif;font-size:1.15rem;}
  .nav-right{display:flex;align-items:center;gap:26px;}
  .nav-link{font-size:.92rem;color:var(--ink-soft);text-decoration:none;}
  .nav-link.active,.nav-link:hover{color:var(--ink);}
  .btn-signin{font-size:.9rem;font-weight:500;background:var(--ink);color:var(--paper);border:none;padding:10px 22px;border-radius:var(--radius);cursor:pointer;text-decoration:none;}
  .btn-signin:hover{background:var(--brass-deep);}

  .wrap{max-width:760px;margin:56px auto 0;padding:0 6%;}
  .kicker{font-size:.85rem;color:var(--brass-deep);font-weight:500;margin-bottom:10px;}
  .wrap h1{font-size:2rem;margin-bottom:10px;}
  .wrap>p.lead{color:var(--ink-soft);font-size:.98rem;max-width:560px;}

  .search-row{display:flex;gap:12px;margin-top:30px;}
  .search-row input{
    flex:1;background:var(--paper-card);border:1px solid var(--rule);padding:13px 16px;
    border-radius:3px;color:var(--ink);font-size:.95rem;font-family:'IBM Plex Mono',monospace;outline:none;
  }
  .search-row input:focus{border-color:var(--brass);}
  .search-row button{background:var(--ink);color:var(--paper);border:none;padding:0 26px;border-radius:3px;font-weight:500;cursor:pointer;font-size:.92rem;}
  .search-row button:hover{background:var(--brass-deep);}
  .hint{font-size:.8rem;color:var(--ink-soft);margin-top:10px;}
  .hint button{background:none;border:none;color:var(--brass-deep);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0;}

  .result{display:none;margin-top:34px;}
  .result.active{display:block;}
  .result-head{
    background:var(--paper-card);border:1px solid var(--rule);border-radius:var(--radius);
    padding:24px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:28px;
  }
  .result-head h2{font-size:1.2rem;}
  .result-head .sub{color:var(--ink-soft);font-size:.85rem;margin-top:4px;}
  .status-pill{padding:6px 16px;border-radius:20px;font-size:.82rem;font-weight:500;white-space:nowrap;}
  .status-pill.progress{background:rgba(156,122,60,0.1);border:1px solid rgba(156,122,60,0.35);color:var(--brass-deep);}
  .status-pill.done{background:rgba(51,96,74,0.1);border:1px solid rgba(51,96,74,0.35);color:var(--sage);}

  .timeline{border-left:2px solid var(--rule);margin-left:8px;padding-left:26px;}
  .t-step{position:relative;padding-bottom:26px;}
  .t-step:last-child{padding-bottom:0;}
  .t-dot{position:absolute;left:-33px;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--rule);background:var(--paper);}
  .t-step.done .t-dot{background:var(--sage);border-color:var(--sage);}
  .t-step.current .t-dot{background:var(--brass);border-color:var(--brass);}
  .t-title{font-size:.95rem;font-weight:500;}
  .t-step.pending .t-title{color:var(--ink-soft);}
  .t-meta{font-size:.8rem;color:var(--ink-soft);margin-top:3px;}

  .not-found{margin-top:30px;color:var(--rust);font-size:.9rem;}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand"><span class="brand-mark">S</span><span class="brand-name">SetuSaathi</span></a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Home</a>
    <a href="checker.html" class="nav-link">Check requirements</a>
    <a href="track.html" class="nav-link active">Track application</a>
    <a href="dashboard.html" class="btn-signin">Sign in</a>
  </div>
</nav>

<div class="wrap">
  <div class="kicker">No sign-in required</div>
  <h1>Track your application</h1>
  <p class="lead">Enter the reference ID you received after submitting to track progress.</p>

  <div class="search-row">
    <input type="text" id="refInput" placeholder="e.g. REQ-2026-8901" value="REQ-2026-8901">
    <button onclick="lookup()">Track</button>
  </div>
  <div class="hint">Try a demo reference: <button onclick="fillAndLookup('REQ-2026-8901')">REQ-2026-8901</button> or <button onclick="fillAndLookup('REQ-2026-8902')">REQ-2026-8902</button></div>

  <div id="notFound" class="not-found"></div>

  <div class="result" id="result">
    <div class="result-head">
      <div>
        <h2 id="resTitle">—</h2>
        <div class="sub" id="resSub">—</div>
      </div>
      <span class="status-pill" id="resPill">—</span>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<script>
  const records = {
    'REQ-2026-8901': {
      title: 'FSSAI Food Safety License (State)',
      sub: 'Applicant: Rohan Verma · Food outlet, rented premises',
      steps: [
        {t:'Structured intake completed', s:'done', m:'12 Sep, 9:02 AM'},
        {t:'Requirements resolved — 4 clearances', s:'done', m:'12 Sep, 9:02 AM'},
        {t:'Documents uploaded', s:'done', m:'12 Sep, 9:20 AM'},
        {t:'Routed to Food Safety & Public Health Dept', s:'done', m:'12 Sep, 9:21 AM'},
        {t:'Under review by department official', s:'current', m:'Flagged critical — lease expiring soon'},
        {t:'Final approval', s:'pending', m:'—'},
      ],
      overall:'progress'
    },
    'REQ-2026-8902': {
      title: 'Health & Sanitation NOC',
      sub: 'Applicant: Priya Sharma · Organic bakery',
      steps: [
        {t:'Structured intake completed', s:'done', m:'11 Sep, 2:10 PM'},
        {t:'Requirements resolved — 3 clearances', s:'done', m:'11 Sep, 2:10 PM'},
        {t:'Documents uploaded', s:'done', m:'11 Sep, 2:30 PM'},
        {t:'Routed to Municipal Corporation', s:'done', m:'11 Sep, 2:31 PM'},
        {t:'Reviewed by department official', s:'done', m:'11 Sep, 4:05 PM'},
        {t:'Approved & digitally signed', s:'done', m:'11 Sep, 4:06 PM'},
      ],
      overall:'done'
    }
  };

  function fillAndLookup(ref){
    document.getElementById('refInput').value = ref;
    lookup();
  }

  function lookup(){
    const val = document.getElementById('refInput').value.trim().toUpperCase();
    const nf = document.getElementById('notFound');
    const res = document.getElementById('result');

    if(!val || (!records[val] && !val.startsWith('REQ-2026-'))){
      nf.innerText = 'Application reference not found. Please check your reference ID.';
      res.classList.remove('active');
      return;
    }

    nf.innerText = '';
    const rec = records[val] || {
      title: 'New Business Clearance',
      sub: 'Applicant: Ayush Sharma · Recently submitted',
      steps: [
        {t:'Structured intake completed', s:'done', m:'Just now'},
        {t:'Requirements resolved', s:'done', m:'Just now'},
        {t:'Documents uploaded', s:'done', m:'Just now'},
        {t:'Routed to relevant department', s:'current', m:'Pending queue'},
        {t:'Under review by official', s:'pending', m:'—'},
        {t:'Final clearance issue', s:'pending', m:'—'},
      ],
      overall:'progress'
    };

    document.getElementById('resTitle').innerText = rec.title;
    document.getElementById('resSub').innerText = rec.sub;
    const pill = document.getElementById('resPill');
    if(rec.overall === 'done'){
      pill.className = 'status-pill done';
      pill.innerText = '✓ Fully cleared';
    } else {
      pill.className = 'status-pill progress';
      pill.innerText = '● In progress';
    }

    const tl = document.getElementById('timeline');
    tl.innerHTML = '';
    rec.steps.forEach(st => {
      const div = document.createElement('div');
      div.className = `t-step ${st.s}`;
      div.innerHTML = `<div class="t-dot"></div><div class="t-title">${st.t}</div><div class="t-meta">${st.m}</div>`;
      tl.appendChild(div);
    });

    res.classList.add('active');
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = sessionStorage.getItem('lastRef');
    if(saved){
      document.getElementById('refInput').value = saved;
    }
    lookup();
  });
</script>
</body>
</html>
